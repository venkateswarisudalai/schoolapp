<!doctype html><html><head><meta charset="utf-8"><style>
  html,body{margin:0;padding:0;width:1024px;height:500px;overflow:hidden}
  body{background:linear-gradient(120deg,#00897B 0%,#00695C 58%,#004D40 100%);
       font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
       display:flex;align-items:center;gap:52px;padding:0 72px;position:relative}
  /* soft brand glow so the flat teal does not read as a plain block */
  body::after{content:'';position:absolute;right:-140px;top:-160px;width:520px;height:520px;
              border-radius:50%;background:radial-gradient(circle,rgba(77,182,172,.38),transparent 68%)}
  .tile{width:268px;height:268px;border-radius:60px;background:#fff;flex:none;
        display:flex;align-items:center;justify-content:center;
        box-shadow:0 24px 60px rgba(0,0,0,.34);position:relative;z-index:1}
  .tile img{width:214px;height:214px;object-fit:contain}
  .copy{position:relative;z-index:1}
  h1{margin:0;color:#fff;font-size:70px;font-weight:800;letter-spacing:-1.6px;line-height:1}
  p{margin:16px 0 0;color:rgba(255,255,255,.9);font-size:30px;font-weight:500;line-height:1.32}
  .chips{display:flex;gap:12px;margin-top:26px}
  .chip{padding:9px 20px;border-radius:999px;background:rgba(255,255,255,.16);
        border:1px solid rgba(255,255,255,.3);color:#fff;font-size:22px;font-weight:600}
</style></head><body>
  <div class="tile"><img src="/icon512.png" alt=""></div>
  <div class="copy">
    <h1>Mayuri Kids</h1>
    <p>School management for preschools<br>and small schools</p>
    <div class="chips"><span class="chip">Attendance</span><span class="chip">Fees</span><span class="chip">Parent updates</span></div>
  </div>
</body></html>
